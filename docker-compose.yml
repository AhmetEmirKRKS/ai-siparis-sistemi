services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: siparis
      POSTGRES_USER: siparis
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siparis -d siparis"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    volumes:
      - ./ai-service:/app
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: siparis
      DB_USERNAME: siparis
      DB_PASSWORD: secret
      AI_SERVICE_URL: http://ai:8001
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    command: >
      sh -c "composer install --no-interaction &&
             ([ -f .env ] || (cp .env.example .env && php artisan key:generate)) &&
             php artisan migrate --force --seed &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: